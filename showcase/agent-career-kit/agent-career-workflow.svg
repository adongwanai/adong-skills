<svg viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Agent Career Kit workflow</title>
  <desc id="desc">One evidence-backed candidate profile drives two stable resumes, projects, interviews, portfolio, and application review.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <style>
      text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; letter-spacing: 0; }
      .title { fill: #f8fafc; font-size: 30px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-size: 14px; }
      .step { fill: #64748b; font-size: 11px; font-weight: 700; }
      .name { fill: #f8fafc; font-size: 16px; font-weight: 700; }
      .desc { fill: #cbd5e1; font-size: 12px; }
      .tiny { fill: #94a3b8; font-size: 10px; }
      .tag { fill: #0f172a; font-size: 10px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#0f172a"/>
  <rect width="1440" height="900" fill="url(#grid)"/>

  <text x="64" y="70" class="title">Agent Career Kit</text>
  <text x="64" y="100" class="subtitle">一份带来源的事实档案，驱动 Agent 开发 / Agent 算法求职全流程</text>
  <rect x="1160" y="54" width="216" height="34" rx="17" fill="#082f49" stroke="#22d3ee"/>
  <text x="1268" y="76" fill="#67e8f9" font-size="11" font-weight="700" text-anchor="middle">Codex · Claude · OpenCode</text>

  <!-- Connection layer -->
  <path d="M 284 314 H 358" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <path d="M 632 314 H 706" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>
  <path d="M 997 256 H 1062" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)"/>
  <path d="M 997 372 H 1062" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)"/>
  <path d="M 997 488 H 1062" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)"/>
  <path d="M 997 604 H 1062" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)"/>
  <path d="M 1210 676 V 752 H 502 V 634" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow-violet)"/>

  <!-- Step 1 -->
  <text x="64" y="166" class="step">01 / INPUT</text>
  <rect x="64" y="192" width="220" height="244" rx="8" fill="#0f172a"/>
  <rect x="64" y="192" width="220" height="244" rx="8" fill="rgba(8,51,68,0.42)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="88" y="230" class="name">候选人真实材料</text>
  <text x="88" y="268" class="desc">原始简历</text>
  <text x="88" y="298" class="desc">GitHub / 项目 / Demo</text>
  <text x="88" y="328" class="desc">论文 / 博客 / 公开主页</text>
  <text x="88" y="358" class="desc">面试记录 / Story Bank</text>
  <text x="88" y="388" class="desc">JD / 公司信息</text>
  <rect x="88" y="404" width="154" height="22" rx="11" fill="#22d3ee"/>
  <text x="165" y="419" class="tag" text-anchor="middle">不编造，不偷换 ownership</text>

  <!-- Step 2 -->
  <text x="358" y="166" class="step">02 / SINGLE SOURCE OF TRUTH</text>
  <rect x="358" y="192" width="274" height="442" rx="8" fill="#0f172a"/>
  <rect x="358" y="192" width="274" height="442" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="382" y="230" class="name">长期候选人档案</text>
  <text x="382" y="260" class="desc">Claim / Bullet / Source ID</text>

  <rect x="382" y="288" width="226" height="72" rx="6" fill="#0f172a" stroke="#a78bfa"/>
  <text x="400" y="316" fill="#ddd6fe" font-size="12" font-weight="700">事实状态</text>
  <text x="400" y="342" class="tiny">provided · confirmed · planned</text>

  <rect x="382" y="378" width="226" height="72" rx="6" fill="#0f172a" stroke="#a78bfa"/>
  <text x="400" y="406" fill="#ddd6fe" font-size="12" font-weight="700">发布范围</text>
  <text x="400" y="432" class="tiny">private · resume · public</text>

  <rect x="382" y="468" width="226" height="72" rx="6" fill="#0f172a" stroke="#a78bfa"/>
  <text x="400" y="496" fill="#ddd6fe" font-size="12" font-weight="700">出货门禁</text>
  <text x="400" y="522" class="tiny">Pass · Improve · Block</text>

  <text x="382" y="578" class="desc">Agent 开发 / 算法能力画像</text>
  <text x="382" y="604" class="desc">Evidence Ledger · Weaknesses</text>

  <!-- Step 3 -->
  <text x="706" y="166" class="step">03 / STABLE CAREER ASSETS</text>
  <rect x="706" y="192" width="291" height="128" rx="8" fill="#0f172a"/>
  <rect x="706" y="192" width="291" height="128" rx="8" fill="rgba(6,78,59,0.42)" stroke="#34d399" stroke-width="1.5"/>
  <text x="730" y="228" class="name">两份稳定主简历</text>
  <text x="730" y="258" class="desc">Agent 开发版 · Agent 算法版</text>
  <text x="730" y="284" class="tiny">原模板版式 · LaTeX · PDF · Overleaf</text>
  <text x="730" y="304" class="tiny">不按单个 JD 反复改写</text>

  <rect x="706" y="340" width="291" height="128" rx="8" fill="#0f172a"/>
  <rect x="706" y="340" width="291" height="128" rx="8" fill="rgba(6,78,59,0.42)" stroke="#34d399" stroke-width="1.5"/>
  <text x="730" y="376" class="name">项目与公开证据</text>
  <text x="730" y="406" class="desc">项目孵化 · README · Demo</text>
  <text x="730" y="432" class="tiny">baseline · metric · trace · ablation</text>
  <text x="730" y="452" class="tiny">动态作品集 · 项目/论文详情</text>

  <rect x="706" y="488" width="291" height="128" rx="8" fill="#0f172a"/>
  <rect x="706" y="488" width="291" height="128" rx="8" fill="rgba(6,78,59,0.42)" stroke="#34d399" stroke-width="1.5"/>
  <text x="730" y="524" class="name">自适应模拟面试</text>
  <text x="730" y="554" class="desc">Focus 20–30 min · Full-loop 45/60 min</text>
  <text x="730" y="580" class="tiny">自我介绍 · 项目 · 八股 · Coding · 反问</text>
  <text x="730" y="600" class="tiny">每轮一题，沿最薄弱分支追问</text>

  <!-- Step 4 -->
  <text x="1062" y="166" class="step">04 / DELIVERY &amp; FEEDBACK</text>
  <rect x="1062" y="210" width="296" height="92" rx="8" fill="#0f172a"/>
  <rect x="1062" y="210" width="296" height="92" rx="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="1086" y="246" class="name">简历投递资产</text>
  <text x="1086" y="274" class="desc">双 PDF · 审计报告 · 内推说明</text>

  <rect x="1062" y="326" width="296" height="92" rx="8" fill="#0f172a"/>
  <rect x="1062" y="326" width="296" height="92" rx="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="1086" y="362" class="name">公开作品集</text>
  <text x="1086" y="390" class="desc">GitHub · Demo · 响应式求职页</text>

  <rect x="1062" y="442" width="296" height="92" rx="8" fill="#0f172a"/>
  <rect x="1062" y="442" width="296" height="92" rx="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="1086" y="478" class="name">公司准备包</text>
  <text x="1086" y="506" class="desc">JD 信号 · 风险画像 · 题目选择</text>

  <rect x="1062" y="558" width="296" height="118" rx="8" fill="#0f172a"/>
  <rect x="1062" y="558" width="296" height="118" rx="8" fill="rgba(120,53,15,0.35)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="1086" y="594" class="name">投递 / 面试 / Offer 复盘</text>
  <text x="1086" y="622" class="desc">Tracker · Rubric · Failure Pattern</text>
  <text x="1086" y="648" class="tiny">弱点回写 → 下一个项目证据 / 训练动作</text>

  <!-- Footer -->
  <rect x="64" y="806" width="1312" height="50" rx="6" fill="#111827" stroke="#334155"/>
  <circle cx="88" cy="831" r="5" fill="#34d399"/>
  <text x="104" y="836" class="tiny">可审计：每个公开 claim 可回溯 source</text>
  <circle cx="425" cy="831" r="5" fill="#22d3ee"/>
  <text x="441" y="836" class="tiny">可独立调用：简历 / 项目 / 面试 / 作品集 / 公司包</text>
  <circle cx="861" cy="831" r="5" fill="#a78bfa"/>
  <text x="877" y="836" class="tiny">公开模板演示，不代表真实候选人或求职结果</text>
</svg>
