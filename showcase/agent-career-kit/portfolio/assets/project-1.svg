<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AgentGuide Career System Architecture</title>
  <desc id="desc">A technical diagram connecting requests, runner, policy, tools, state, traces, evaluation and release gates.</desc>
  <rect width="1280" height="720" fill="#ecece7"/>
  <g font-family="Arial, sans-serif" fill="#161616">
    <text x="72" y="86" font-size="28" font-weight="700">AGENTGUIDE CAREER SYSTEM</text>
    <text x="72" y="122" font-size="16" fill="#5f6468">Runtime path and evidence loop</text>
  </g>
  <g stroke="#161616" stroke-width="3" fill="#ffffff">
    <rect x="72" y="200" width="176" height="86" rx="6"/>
    <rect x="326" y="178" width="250" height="130" rx="6" fill="#fff4f1"/>
    <rect x="664" y="142" width="210" height="78" rx="6"/>
    <rect x="664" y="254" width="210" height="78" rx="6"/>
    <rect x="962" y="178" width="238" height="130" rx="6" fill="#e9f6f5"/>
    <rect x="326" y="438" width="250" height="112" rx="6"/>
    <rect x="664" y="438" width="210" height="112" rx="6"/>
    <rect x="962" y="438" width="238" height="112" rx="6" fill="#fff4f1"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#161616">
    <text x="160" y="238" font-size="18" font-weight="700">REQUEST</text><text x="160" y="264" font-size="14">task + constraints</text>
    <text x="451" y="226" font-size="22" font-weight="700">AGENT RUNNER</text><text x="451" y="258" font-size="14">state - stop - budget</text><text x="451" y="282" font-size="14">checkpoint - recovery</text>
    <text x="769" y="177" font-size="18" font-weight="700">POLICY</text><text x="769" y="201" font-size="14">permission gate</text>
    <text x="769" y="289" font-size="18" font-weight="700">TOOLS</text><text x="769" y="313" font-size="14">schema - dispatch</text>
    <text x="1081" y="226" font-size="22" font-weight="700">STATE STORE</text><text x="1081" y="258" font-size="14">session - memory</text><text x="1081" y="282" font-size="14">artifacts</text>
    <text x="451" y="480" font-size="20" font-weight="700">TRACE</text><text x="451" y="509" font-size="14">action - observation</text><text x="451" y="532" font-size="14">latency - cost</text>
    <text x="769" y="480" font-size="20" font-weight="700">EVAL</text><text x="769" y="509" font-size="14">outcome - trajectory</text><text x="769" y="532" font-size="14">safety</text>
    <text x="1081" y="480" font-size="20" font-weight="700">SHIP GATE</text><text x="1081" y="509" font-size="14">block - caution</text><text x="1081" y="532" font-size="14">pass - improve</text>
  </g>
  <g stroke="#b42318" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M248 243 H326"/><path d="M576 243 H650"/><path d="M874 181 H948"/><path d="M874 293 H948"/>
    <path d="M451 308 V424"/><path d="M576 494 H650"/><path d="M874 494 H948"/>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b42318"/></marker></defs>
</svg>
