<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="分层记忆 Agent 从任务、记忆检索、工具调用到评测的 trace 示例图">
  <rect width="960" height="540" fill="#f8fafc"/>
  <rect x="48" y="42" width="864" height="456" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="76" y="92" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Memory Evidence Loop</text>
  <text x="76" y="126" font-family="Arial, sans-serif" font-size="16" fill="#475569">任务、记忆召回、工具调用、Verifier 与失败复盘全部进入可检索轨迹。</text>
  <g font-family="Arial, sans-serif" font-size="17" font-weight="700">
    <rect x="76" y="180" width="150" height="72" rx="12" fill="#dbeafe" stroke="#2563eb"/>
    <text x="107" y="224" fill="#1e3a8a">Request</text>
    <rect x="286" y="180" width="150" height="72" rx="12" fill="#dcfce7" stroke="#16a34a"/>
    <text x="329" y="224" fill="#14532d">Patch</text>
    <rect x="496" y="180" width="150" height="72" rx="12" fill="#fef3c7" stroke="#d97706"/>
    <text x="545" y="224" fill="#78350f">Test</text>
    <rect x="706" y="180" width="150" height="72" rx="12" fill="#fee2e2" stroke="#dc2626"/>
    <text x="748" y="224" fill="#7f1d1d">Rollback</text>
  </g>
  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M226 216 H286"/>
    <path d="M436 216 H496"/>
    <path d="M646 216 H706"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="16" fill="#334155">
    <rect x="92" y="318" width="776" height="110" rx="14" fill="#f1f5f9"/>
    <text x="126" y="358">trace_id: task-042</text>
    <text x="126" y="388">failure_type: stale_memory | tool_selection | unsafe_operation</text>
    <text x="126" y="418">verifier: evidence_match + freshness + permission_gate</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10" fill="#64748b"/>
    </marker>
  </defs>
</svg>
