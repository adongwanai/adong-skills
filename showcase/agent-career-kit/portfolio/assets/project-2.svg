<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Agent 评测 pipeline 的任务、trace、failure schema 关系图">
  <rect width="960" height="540" fill="#f8fafc"/>
  <rect x="48" y="44" width="864" height="452" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="78" y="96" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Agent Evaluation Pipeline</text>
  <text x="78" y="130" font-family="Arial, sans-serif" font-size="16" fill="#475569">把业务结果、任务完成度和过程证据分开记录，避免一个模糊总分掩盖失败原因。</text>
  <g font-family="Arial, sans-serif" font-size="17">
    <rect x="100" y="184" width="190" height="198" rx="14" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="146" y="224" font-weight="700" fill="#0c4a6e">Task Schema</text>
    <text x="130" y="268" fill="#0369a1">input</text>
    <text x="130" y="302" fill="#0369a1">tools_allowed</text>
    <text x="130" y="336" fill="#0369a1">success_rule</text>
    <rect x="386" y="184" width="190" height="198" rx="14" fill="#dcfce7" stroke="#16a34a"/>
    <text x="432" y="224" font-weight="700" fill="#14532d">Trace Schema</text>
    <text x="416" y="268" fill="#166534">action</text>
    <text x="416" y="302" fill="#166534">observation</text>
    <text x="416" y="336" fill="#166534">stop_reason</text>
    <rect x="672" y="184" width="190" height="198" rx="14" fill="#fee2e2" stroke="#dc2626"/>
    <text x="710" y="224" font-weight="700" fill="#7f1d1d">Failure Schema</text>
    <text x="702" y="268" fill="#991b1b">type</text>
    <text x="702" y="302" fill="#991b1b">evidence</text>
    <text x="702" y="336" fill="#991b1b">regression</text>
  </g>
  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M290 283 H386"/>
    <path d="M576 283 H672"/>
  </g>
  <text x="164" y="440" font-family="Arial, sans-serif" font-size="17" fill="#334155">Executable checks first; human review only for judgment-heavy cases.</text>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10" fill="#64748b"/>
    </marker>
  </defs>
</svg>
