<svg viewBox="0 0 1600 1200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Agent Career Kit architecture</title>
  <desc id="desc">A light-background architecture diagram showing inputs, private workspace, agent routes, deterministic scripts, outputs, and feedback loops for Agent Career Kit.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0,11 4,0 8" fill="#2563eb"/>
    </marker>
    <marker id="arrow-slate" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0,11 4,0 8" fill="#64748b"/>
    </marker>
    <marker id="arrow-amber" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0,11 4,0 8" fill="#d97706"/>
    </marker>
    <filter id="soft-shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; letter-spacing: 0; }
      .title { fill: #0f172a; font-size: 34px; font-weight: 800; }
      .subtitle { fill: #475569; font-size: 15px; font-weight: 500; }
      .layer { fill: #334155; font-size: 12px; font-weight: 800; }
      .name { fill: #0f172a; font-size: 16px; font-weight: 800; }
      .body { fill: #334155; font-size: 11px; font-weight: 530; }
      .small { fill: #64748b; font-size: 9.5px; font-weight: 620; }
      .tag { fill: #ffffff; font-size: 9.5px; font-weight: 800; }
      .pill { fill: #1e293b; font-size: 10px; font-weight: 800; }
    </style>
  </defs>

  <rect width="1600" height="1200" fill="#ffffff"/>
  <path d="M0 100 H1600 M0 240 H1600 M0 380 H1600 M0 520 H1600 M0 660 H1600 M0 800 H1600 M0 940 H1600 M0 1080 H1600" stroke="#e2e8f0" stroke-width="1"/>
  <path d="M100 0 V1200 M300 0 V1200 M500 0 V1200 M700 0 V1200 M900 0 V1200 M1100 0 V1200 M1300 0 V1200 M1500 0 V1200" stroke="#f1f5f9" stroke-width="1"/>

  <text x="60" y="58" class="title">Agent Career Kit · 技能架构</text>
  <text x="60" y="88" class="subtitle">小白输入、私有事实源、Agent 判断、确定性脚本和公开产物之间的关系</text>
  <rect x="1266" y="42" width="274" height="34" rx="17" fill="#eff6ff" stroke="#2563eb"/>
  <text x="1403" y="64" fill="#1d4ed8" font-size="12" font-weight="800" text-anchor="middle">Codex · Claude Code · OpenCode</text>

  <!-- Layer backgrounds -->
  <rect x="60" y="128" width="1480" height="132" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="84" y="156" class="layer">01 · 用户输入层</text>
  <rect x="60" y="308" width="1480" height="214" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="84" y="336" class="layer">02 · 私有候选人 Workspace</text>
  <rect x="60" y="570" width="1480" height="286" rx="14" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="84" y="598" class="layer">03 · 可单独调用的 Agent 工作流</text>
  <rect x="60" y="904" width="1480" height="176" rx="14" fill="#fffbeb" stroke="#fde68a"/>
  <text x="84" y="932" class="layer">04 · 交付产物与求职运营</text>

  <!-- Arrows -->
  <path d="M300 226 V288 H800 V354" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M800 226 V354" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M1300 226 V288 H800" fill="none" stroke="#2563eb" stroke-width="3"/>
  <path d="M800 488 V548 H230 V628" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-slate)"/>
  <path d="M800 488 V548 H570 V628" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-slate)"/>
  <path d="M800 488 V548 H910 V628" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-slate)"/>
  <path d="M800 488 V548 H1250 V628" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-slate)"/>
  <path d="M230 812 V882 H230 V956" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrow-slate)"/>
  <path d="M570 812 V956" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrow-slate)"/>
  <path d="M910 812 V956" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrow-slate)"/>
  <path d="M1250 812 V956" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrow-slate)"/>
  <path d="M1250 1048 V1134 H800 V522" fill="none" stroke="#d97706" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-amber)"/>

  <!-- Input layer -->
  <rect x="90" y="176" width="420" height="66" rx="10" fill="#ffffff" stroke="#2563eb" filter="url(#soft-shadow)"/>
  <text x="116" y="205" class="name">候选人材料</text>
  <text x="116" y="229" class="body">简历 · GitHub · 项目 · Demo · 论文 · 博客</text>
  <rect x="590" y="176" width="420" height="66" rx="10" fill="#ffffff" stroke="#2563eb" filter="url(#soft-shadow)"/>
  <text x="616" y="205" class="name">训练材料</text>
  <text x="616" y="229" class="body">面试记录 · 小红书题库 · Coding 结果 · 弱项反馈</text>
  <rect x="1090" y="176" width="420" height="66" rx="10" fill="#ffffff" stroke="#2563eb" filter="url(#soft-shadow)"/>
  <text x="1116" y="205" class="name">市场信号</text>
  <text x="1116" y="229" class="body">JD · 目标公司 · 职级 · 轮次 · Offer 条件</text>

  <!-- Workspace layer -->
  <rect x="90" y="358" width="454" height="128" rx="10" fill="#ffffff" stroke="#94a3b8" filter="url(#soft-shadow)"/>
  <rect x="116" y="382" width="72" height="22" rx="11" fill="#475569"/>
  <text x="152" y="397" class="tag" text-anchor="middle">事实源</text>
  <text x="116" y="434" class="name">candidate-profile.json</text>
  <text x="116" y="462" class="body">稳定 Claim / Bullet ID · 教育 · 经历 · 项目 · 技能 · 论文 · 联系方式</text>

  <rect x="573" y="358" width="454" height="128" rx="10" fill="#ffffff" stroke="#94a3b8" filter="url(#soft-shadow)"/>
  <rect x="599" y="382" width="72" height="22" rx="11" fill="#475569"/>
  <text x="635" y="397" class="tag" text-anchor="middle">证据门</text>
  <text x="599" y="434" class="name">事实、可见性、出货状态分离</text>
  <text x="599" y="462" class="body">provided / confirmed / planned · private / resume / public · pass / improve / block</text>

  <rect x="1056" y="358" width="454" height="128" rx="10" fill="#ffffff" stroke="#94a3b8" filter="url(#soft-shadow)"/>
  <rect x="1082" y="382" width="72" height="22" rx="11" fill="#475569"/>
  <text x="1118" y="397" class="tag" text-anchor="middle">记忆</text>
  <text x="1082" y="434" class="name">长期职业状态</text>
  <text x="1082" y="462" class="body">能力画像 · Story Bank · Weaknesses · 学习进度 · 投递与面试历史</text>

  <!-- Workflow layer -->
  <rect x="90" y="628" width="280" height="184" rx="10" fill="#ffffff" stroke="#059669" filter="url(#soft-shadow)"/>
  <rect x="116" y="650" width="64" height="22" rx="11" fill="#059669"/>
  <text x="148" y="665" class="tag" text-anchor="middle">简历</text>
  <text x="116" y="704" class="name">审计与双方向渲染</text>
  <text x="116" y="732" class="body">30 秒印象 · So What · 逐 bullet</text>
  <text x="116" y="758" class="body">开发版 / 算法版按需启用</text>
  <text x="116" y="786" class="small">脚本：LaTeX · PDF · Overleaf</text>

  <rect x="430" y="628" width="280" height="184" rx="10" fill="#ffffff" stroke="#059669" filter="url(#soft-shadow)"/>
  <rect x="456" y="650" width="64" height="22" rx="11" fill="#059669"/>
  <text x="488" y="665" class="tag" text-anchor="middle">项目</text>
  <text x="456" y="704" class="name">项目与学习补强</text>
  <text x="456" y="732" class="body">能力缺口 → 最小证据任务</text>
  <text x="456" y="758" class="body">实验 · README · Demo · 讲解稿</text>
  <text x="456" y="786" class="small">建议稿和已完成成果分层</text>

  <rect x="770" y="628" width="280" height="184" rx="10" fill="#ffffff" stroke="#059669" filter="url(#soft-shadow)"/>
  <rect x="796" y="650" width="64" height="22" rx="11" fill="#059669"/>
  <text x="828" y="665" class="tag" text-anchor="middle">面试</text>
  <text x="796" y="704" class="name">题库与模拟面试</text>
  <text x="796" y="732" class="body">L1-L5 检索 · 单点 grill-me</text>
  <text x="796" y="758" class="body">45-60 分钟全流程</text>
  <text x="796" y="786" class="small">一次一题，复盘后回写弱项</text>

  <rect x="1110" y="628" width="400" height="184" rx="10" fill="#ffffff" stroke="#059669" filter="url(#soft-shadow)"/>
  <rect x="1136" y="650" width="84" height="22" rx="11" fill="#059669"/>
  <text x="1178" y="665" class="tag" text-anchor="middle">投递运营</text>
  <text x="1136" y="704" class="name">作品集、JD 包与 Offer 驾驶舱</text>
  <text x="1136" y="732" class="body">个人求职页 · 公司准备包 · 独立投递快照</text>
  <text x="1136" y="758" class="body">投递、面试、Offer、下一最佳行动</text>
  <text x="1136" y="786" class="small">JD 不污染长期主档案</text>

  <!-- Outputs -->
  <rect x="90" y="956" width="280" height="76" rx="10" fill="#ffffff" stroke="#d97706" filter="url(#soft-shadow)"/>
  <text x="116" y="988" class="name">简历产物</text>
  <text x="116" y="1014" class="body">开发版 / 算法版 PDF、TeX、Overleaf</text>
  <rect x="430" y="956" width="280" height="76" rx="10" fill="#ffffff" stroke="#d97706" filter="url(#soft-shadow)"/>
  <text x="456" y="988" class="name">项目资产</text>
  <text x="456" y="1014" class="body">Repo、README、Demo、项目讲解稿</text>
  <rect x="770" y="956" width="280" height="76" rx="10" fill="#ffffff" stroke="#d97706" filter="url(#soft-shadow)"/>
  <text x="796" y="988" class="name">训练资产</text>
  <text x="796" y="1014" class="body">Question Pack、Review、复训任务</text>
  <rect x="1110" y="956" width="400" height="76" rx="10" fill="#ffffff" stroke="#d97706" filter="url(#soft-shadow)"/>
  <text x="1136" y="988" class="name">公开与运营资产</text>
  <text x="1136" y="1014" class="body">Portfolio、Application Packet、Career Dashboard</text>

  <!-- Footer -->
  <rect x="60" y="1130" width="1480" height="42" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <circle cx="90" cy="1151" r="5" fill="#2563eb"/>
  <text x="106" y="1156" class="small">小白可从最小输入启动</text>
  <circle cx="314" cy="1151" r="5" fill="#059669"/>
  <text x="330" y="1156" class="small">单个模块可独立调用</text>
  <circle cx="532" cy="1151" r="5" fill="#d97706"/>
  <text x="548" y="1156" class="small">对外事实来自候选人提供或确认</text>
  <circle cx="834" cy="1151" r="5" fill="#64748b"/>
  <text x="850" y="1156" class="small">公开模板演示，不代表真实求职结果</text>
</svg>
